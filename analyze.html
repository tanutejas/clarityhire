<!DOCTYPE html>
<html lang="en">
<head>

  <title>ClarityHire — Resume Intelligence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

</head>

<body>

<div class="nav">ClarityHire</div>

<section class="analyze">

<script src="script.js"></script>
