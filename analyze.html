<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Analyze Resume — ClarityHire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<nav class="nav">
  <div class="logo">ClarityHire</div>
</nav>

<section class="analyze">
  <h2>Resume Intelligence Engine</h2>

  <input type="file" id="files" multiple accept=".txt" />
  <textarea id="resume" placeholder="Paste Resume Here"></textarea>
  <textarea id="jd" placeholder="Paste Job Description Here"></textarea>

  <button onclick="analyze()">Analyze Resume</button>

  <!-- Output section -->
  <div id="output" class="output">
    <h2>Overall Match Score: <span id="score"></span></h2>

    <h3>Strengths</h3>
    <ul id="strengths"></ul>

    <h3>Gaps</h3>
    <ul id="gaps"></ul>

    <h3>Suggestions</h3>
    <ul id="suggestions"></ul>
  </div>
</section>

<script src="script.js"></script>
<link rel="stylesheet" href="styles.css">
</body>
</html>
