<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ClarityHire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">ClarityHire</div>
    <div class="tag">AI Resume Intelligence</div>
  </header>

  <main class="card">

    <h1>Resume Screening</h1>
    <p class="subtitle">Instant ATS scoring & smart candidate ranking</p>

    <input type="file" id="files" multiple accept=".txt" />

    <textarea id="resume" placeholder="Paste resume (optional)"></textarea>
    <textarea id="jd" placeholder="Paste job description"></textarea>

    <button onclick="analyze()">Analyze</button>

    <div id="output" class="output"></div>

  </main>

</div>

<script src="script.js"></script>
</body>
</html>
